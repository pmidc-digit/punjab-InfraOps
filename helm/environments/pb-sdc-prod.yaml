#  bpa-edcr>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
bpa-services:
  memory_limits: 384Mi
  java-args: -Dspring.profiles.active=monitoring
  java-debug: true
  tracing-enabled: "true"
  egov.idgen.bpa.applicationNum.format: PB-BP-[cy:yyyy-MM-dd]-[SEQ_EG_BP_APN]

bpa-calculator:
  memory_limits: 384Mi
  java-args: -Dspring.profiles.active=monitoring
  java-debug: true
  tracing-enabled: "true"

egov-edcr:
  replicas: 4
  resources: |
    limits:
      cpu: 4000m
      memory: 10Gi
    requests:
      cpu: 4000m
      memory: 10Gi  
  ingress:
    enabled: true
    zuul: true
    context: "edcr"
microservice: |
  indexer.host=http://egov-indexer.egov:8080/
  egov.services.egov-indexer.url=egov-indexer/index-operations/{edcr-create-application}/_index
  edcr.indexer.data.push.required=true
  ms.url=http://egov-filestore.egov:8080/
  filestoreservice.beanname=egovMicroServiceStore

