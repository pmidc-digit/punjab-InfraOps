# <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<

# demand >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
demand-services:
  replicas: 1
# <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<

# docs >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
redoc:
  replicas: 2
  images:
    - egovio/redoc:v1.0.5
  service_type: LoadBalancer
# <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<


chb-services:
  memory_limits: 512Mi
  heap: "-Xmx256m -Xms256m" 

# gateway >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
zuul:
  replicas: 5
  custom-filter-property: "true"
  prehook-config: "https://raw.githubusercontent.com/egovernments/punjab-rainmaker-customization/PROD_V2/configs/egov-zuul/pre-hook.json"
  posthook-config: "https://raw.githubusercontent.com/pmidc-digit/punjab-rainmaker-customization/PROD_V2/configs/egov-zuul/post-hook.json"
  initContainers:
    gitSync:
        repo: "git@github.com:pmidc-digit/punjab-rainmaker-customization"
        branch: "PROD_V2"
  heap: "-Xmx1280m -Xms1280m -XX:TieredStopAtLevel=1"
  memory_limits: 1536Mi
  resources: |
    limits:
      cpu: 500m
      memory: 1536Mi
    requests:
      cpu: 500m
      memory: 1536Mi  
  server-tomcat-max-threads: "350"
  server-tomcat-max-connections: "2500"
  zuul-host-connect-timeout-millis: "30000"
  zuul-host-socket-timeout-millis: "80000"  
