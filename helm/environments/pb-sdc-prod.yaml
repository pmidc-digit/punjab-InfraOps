egov-user-enc:
  replicas: 2
  heap: "-Xmx256m -Xms256m -XX:TieredStopAtLevel=1"
  memory_limits: 512Mi
  otp-validation: "true"
  citizen-otp-enabled: "true"
  employee-otp-enabled: "false"
  access-token-validity: 10080
  refresh-token-validity: 20160
  default-password-expiry: 90
  mobile-number-validation: "false"
  roles-state-level: "true"
  citizen-registration-withlogin: "true"
  java-args: "-Dspring.profiles.active=production"
  egov-state-level-tenant-id: "pb"
  decryption-abac-enabled: "false"
  account-unlock-cool-down-period-minutes: 5
  db-url: "jdbc:postgresql://10.44.242.67:5432/egov_prod_db?currentSchema=case_management"   

egov-gisintegration:
  replicas: 1
  resources: |
    limits:
      cpu: 600m
      memory: 2024Mi
    requests:
      cpu: 500m
      memory: 1950Mi
  java-args: "-Dspring.profiles.active=production"
  heap: "-Xms1524m -Xmx1900m"

pdf-service:
  replicas: 1
  resources: |
    limits:
      cpu: 4000m
      memory: 10Gi
    requests:
      cpu: 1100m
      memory: 2500Mi   
  initContainers:
    gitSync:
      repo: "git@github.com:pmidc-digit/punjab-rainmaker-customization"
      branch: "PROD_V2"
