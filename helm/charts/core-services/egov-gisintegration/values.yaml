# Common Labels
labels:
  app: "egov-gisintegration"
  group: "core"
metadata:
  namespace: "egov"
docker:
  account: "pmidcio"
# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "egov-gisintegration"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: false
    schemaTable: "egov_gisintegration_schema"
    image:
      repository: "egov-gisintegration-db"

# Container Configs
image:
  repository: "egov-gisintegration"
replicas: "1"
healthChecks:
  enabled: false
  livenessProbePath: "/egov-gisintegration/health"
  readinessProbePath: "/egov-gisintegration/health"
  livenessProbeInitialDelay: 30
  readinessProbeInitialDelay: 20
  periodSeconds: 10
appType: "java-spring"
tracing-enabled: true
heap: "-Xms1524m -Xmx1836m"

resources: |
  limits:
    cpu: 600m
    memory: 2500Mi
  requests:
    cpu: 500m
    memory: 2.1Gi

# Additional Container Envs
env: |
  - name: JAVA_OPTS
    value: "-Xms1524m -Xmx1900m -XX:+UseG1GC -XX:+UseContainerSupport"
  - name: EGOV_WATERSERVICE_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: ws-services
  - name: EGOV_SEWERAGESERVICE_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: sw-services
  - name: EGOV_PROPERTYSERVICE_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: property-services
  - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
    value: org.postgresql.Driver
  - name: SPRING_DATASOURCE_URL
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-host-gis
  - name: SPRING_DATASOURCE_DB_NAME
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-name
  - name: KAFKA_CONFIG_BOOTSTRAP_SERVER_CONFIG
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: kafka-brokers
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: kafka-brokers
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: db-gis
        key: username
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-gis
        key: password
  - name: SPRING_DATASOURCE_PORT
    value: "5432"