# Common Labels
labels:
  app: "egov-gisintegration"
  group: "core"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "egov-gisintegration"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: false
    schemaTable: "egov_gisintegration_schema"
    image:
      repository: "egov-gisintegration-db"

# Container Configs
image:
  repository: "egov-gisintegration"
replicas: "1"
healthChecks:
  enabled: false
  livenessProbePath: "/egov-gisintegration/health"
  readinessProbePath: "/egov-gisintegration/health"
  livenessProbeInitialDelay: 30
  readinessProbeInitialDelay: 20
  periodSeconds: 10
appType: "java-spring"
tracing-enabled: true
heap: "-Xms1524m -Xmx1836m"
resources:
  requests:
    cpu: "800m"
    memory: "2000Mi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

# Additional Container Envs
env: |
  - name: JAVA_OPTS
    value: "-Xms1524m -Xmx1836m -XX:+UseG1GC -XX:+UseContainerSupport"
  - name: EGOV_WATERSERVICE_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: ws-services
  - name: EGOV_SEWERAGESERVICE_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: sw-services
  - name: EGOV_PROPERTYSERVICE_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: property-services
  - name: SPRING_DATASOURCE_URL
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-host
  - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
    value: org.postgresql.Driver
  - name: DB_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-host
  - name: DB_NAME
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-name
  - name: DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: db
        key: username
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db
        key: password
  - name: DB_PORT
    value: "5432"
