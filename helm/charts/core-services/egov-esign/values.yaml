# Common Labels
labels:
  app: "egov-esign"
  group: "core"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "egov-esign"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: false
    schemaTable: "egov_esign_schema"
    image:
      repository: "egov-esign-db"

# Container Configs
image:
  repository: "egov-esign"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/egov-esign/actuator/health"
  readinessProbePath: "/egov-esign/actuator/health"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx292m -Xms292m"

# Additional Container Envs
env: |
  - name: SERVER_PORT
    value: "8080"
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SECURITY_BASIC_ENABLED
    value: "false"  
  - name: MANAGEMENT_SECURITY_ENABLED
    value: "false"
  - name: ESIGN_PRIVATE_KEY_FILENAME
    valueFrom:
      secretKeyRef:
        name: esign-secret
        key: esign.private.key.filename   
