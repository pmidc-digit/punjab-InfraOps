# Common Labels
labels:
  app: "egov-indexer-v2"
  group: "core"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "egov-indexer-v2"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: false
    schemaTable: "egov_indexer_v2_schema"
    image:
      repository: "egov-indexer-v2-db"
  gitSync:
    enabled: true
    repo: "git@github.com:egovernments/configs"
    branch: "master"

# Container Configs
image:
  repository: "egov-indexer-v2"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/egov-indexer-v2/health"
  readinessProbePath: "/egov-indexer-v2/health"
appType: "java-spring"
tracing-enabled: true
#egov-indexer-yaml-repo-path: "file:///work-dir/configs/egov-indexer/billingservices-indexer.yml,file:///work-dir/configs/egov-indexer/collection-indexer.yml,file:///work-dir/configs/egov-indexer/egov-telemetry-indexer.yml,file:///work-dir/configs/egov-indexer/egov-uploader-indexer.yml,file:///work-dir/configs/egov-indexer/error-queue.yml,file:///work-dir/configs/egov-indexer/finance-rolloutadotpion-indexer.yml,file:///work-dir/configs/egov-indexer/payment-indexer.yml,file:///work-dir/configs/egov-indexer/rainmaker-pgr-indexer.yml,file:///work-dir/configs/egov-indexer/rainmaker-pt-indexer.yml,file:///work-dir/configs/egov-indexer/rainmaker-tl-indexer.yml"
#egov-indexer-yaml-repo-path: "file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/chb-service-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/land-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/garbage-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/bpa-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/clu-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/challan-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/layout-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/advertisement-service-indexer.yaml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/ptr-indexer.yaml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/egov-survey-service-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/egov-ndc-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/whatsapp-adoption-data.yaml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/chatbot-telemetry-v2.yaml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/billingservices-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/collection-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/egov-telemetry-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/egov-uploader-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/finance-rolloutadoption-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/rainmaker-pgr-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/rainmaker-pt-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/rainmaker-tl-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/payment-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/water-service.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/water-services-meter.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/sewerage-service.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/property-services.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/error-queue.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/payment-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/rainmaker-firenoc-indexer.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/payment-indexer-migration.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/property-services-migration-temp.yml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/covid-chatbot-telemetry.yaml,file:///work-dir/punjab-rainmaker-customization/configs/egov-indexer/chatbot-telemetry-v2.yaml"
heap: "-Xmx192m -Xms192m"

# Additional Container Envs
env: |
  - name: EGOV_MDMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-mdms-service
  - name: EGOV_EDCR_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-edcr
  - name: EGOV_BPA_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: bpa-services
  - name: "ELASTICSEARCH_PASSWORD"
    valueFrom:
      secretKeyRef: 
        name: es-password
        key: password
  - name: EGOV_SERVICES_INFRA_INDEXER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-indexer-v2
  - name: EGOV_INFRA_INDEXER_HOST
    value: "http://elasticsearch-data-v2.es-cluster-v2:9200/"
  - name: EGOV_INDEXER_YML_REPO_PATH
    value: {{ index .Values "egov-indexer-yaml-repo-path" | quote }}
  {{- if index .Values "global" "serializers-timezone-in-ist" }}
  - name: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
    value: org.egov.tracer.kafka.serializer.ISTTimeZoneJsonSerializer
  {{- end }}
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SECURITY_BASIC_ENABLED
    value: "false"  
  - name: MANAGEMENT_SECURITY_ENABLED
    value: "false"
  - name: EGOV_STATELEVEL_TENANTID
    valueFrom:
      configMapKeyRef:
        name: egov-config

        key: egov-state-level-tenant-id





