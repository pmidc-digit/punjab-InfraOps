  - name: MODULE_ALLOWED_GROUPBY_FIELDS_MAPPING
    value: {"PT":{"financialYear","usageCategory","paymentChannelType"},"WS":{"connectionType","channelType","usageType","paymentChannelType","taxHeads","meterType","duration"},"FIRENOC":{"applicationType","department","paymentMode","type","usageType"},"OBPS":{"paymentMode","riskType","occupancyType","subOccupancyType"},"PGR":{"status","channel","department","category"},"TL":{"tradeType","status","paymentChannelType"},"MCOLLECT":{"paymentMode","status","category","challanStatus"},"FSM":{"paymentChannelType","usageCategory"},"COMMON":{"serviceModuleCode"}} 
  - name: SERVER_TOMCAT_MAX_THREADS
    value:  {{ index .Values "server-tomcat-max-threads" | quote }}
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  - name: SECURITY_BASIC_ENABLED
    value: "false"  
  - name: MANAGEMENT_SECURITY_ENABLED
    value: "false"
