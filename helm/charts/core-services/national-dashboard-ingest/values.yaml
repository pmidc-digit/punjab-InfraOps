# Common Labels
labels:
  app: "national-dashboard-ingest"
  group: "rainmaker"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "national-dashboard"
  
# Init Containers Configs
initContainers:
  dbMigration:
    enabled: false
    schemaTable: "national_dashboard_ingest_schema"
    image:
      repository: "national-dashboard-ingest-db"

# Container Configs
image:
  repository: "national-dashboard-ingest"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/national-dashboard/health"
  readinessProbePath: "/national-dashboard/health"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx512m -Xms128m"
java-args: "-Dspring.profiles.active=monitoring"

# Additional Container Envs
env: |
  - name: SPRING_KAFKA_CONSUMER_GROUP_ID
    value: egov-nss-ingest
  - name: SPRING_KAFKA_PRODUCER_KEY_SERIALIZER
    value: org.apache.kafka.common.serialization.StringSerializer
  - name: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
    value: org.springframework.kafka.support.serializer.JsonSerializer
  - name: EGOV_ES_HOST
    value: "http://elasticsearch-data-v2.es-cluster-v2:9200/"
  - name: MODULE_INDEX_MAPPING
    value: {"PT": "pt-national-dashboard", "PGR": "pgr-national-dashboard", "WS": "ws-national-dashboard", "FIRENOC": "firenoc-national-dashboard", "TL": "tl-national-dashboard", "MCOLLECT": "mcollect-national-dashboard", "OBPS": "obps-national-dashboard", "COMMON": "common-national-dashboard", "BPA": "bpa-national-dashboard", "BIRTH":"birth-cert-national-dashboard", "DEATH":"death-cert-national-dashboard","FSM":"fsm-national-dashboard"}
  - name: MASTER_DATA_INDEX
    value: master-data-index
  - name: MODULE_FIELDS_MAPPING
    value: {"PT":{"transactions":"array::number","totalApplications":"number","assessments":"number","assessedProperties":"array::number","propertiesRegistered":"array::number","todaysCollection":"array::number","propertyTax":"array::number","cess":"array::number","rebate":"array::number","penalty":"array::number","interest":"array::number","todaysApprovedApplications":"number","todaysApprovedApplicationsWithinSLA":"number","avgDaysForApplicationApproval":"number"},"TL":{"transactions":"number","todaysApplications":"number","todaysLicenseIssued":"number","tlTax":"number","adhocPenalty":"number","adhocRebate":"number","todaysCollection":"array::number","todaysTradeLicenses":"array::number","applicationsMovedToday":"array::number","todaysApprovedApplications":"number","todaysApprovedApplicationsWithinSLA":"number"},"PGR":{"closedComplaints":"number","slaAchievement":"number","completionRate":"number","uniqueCitizens":"number","resolvedComplaints":"number","todaysComplaints":"array::number","todaysReopenedComplaints":"array::number","todaysOpenComplaints":"array::number","todaysAssignedComplaints":"array::number","todaysRejectedComplaints":"array::number","todaysReassignedComplaints":"array::number"},"WS":{"transactions":"number","connectionsCreated":"array::number","todaysCollection":"array::number","sewerageConnections":"array::number","waterConnections":"array::number","pendingConnections":"array::number"},"MCOLLECT":{"numberOfCategories":"number","todaysCollection":"array::number","numberOfReceipts":"array::number","numberOfChallans":"array::number"},"OBPS":{"ocPlansScrutinized":"number","plansScrutinized":"number","ocSubmitted":"number","applicationsSubmitted":"number","ocIssued":"number","landAreaAppliedInSystemForBPA":"number","averageDaysToIssuePermit":"number","averageDaysToIssueOC":"number","todaysCollection":"array::number","permitsIssued":"array::number","todaysApprovedApplications":"number","todaysApprovedApplicationsWithinSLA":"number"},"FIRENOC":{"todaysApplications":"array::number","todaysCollection":"array::number","NOCIssuedtoday":"array::number","provisionalNOCIssued":"array::number","actualNOCIssued":"array::number","avgDaysToIssueProvisionalNOC":"array::number","slaComplianceActual":"array::number","slaComplianceProvisional":"array::number","avgDaysToIssueActualNOC":"array::number","todaysApprovedApplications":"number","todaysApprovedApplicationsWithinSLA":"number"},"COMMON":{"onboardedUlbsCount":"number","totalCitizensCount":"number","slaAchievement":"number","liveUlbsCount":"number","activeUlbsCount":"number"},"BIRTH": {"todaysApprovedApplications":"number","todaysApprovedApplicationsWithinSLA":"number"},"DEATH":{"todaysApprovedApplications":"number","todaysApprovedApplicationsWithinSLA":"number"},"FSM":{"transactions":"number","todaysApplications":"number","todaysApprovedApplicationsWithinSLA":"number","todaysClosedApplications":"number","todaysApprovedApplications":"number","totalVehicleTrips":"number","totalSludgeDumped":"number","totalSludgeCollected":"number","totalFSTPCapacity":"number","todaysCollection":"array::number","averageCitizenRating":"number"}}
  - name: MASTER_MODULE_FIELDS_MAPPING
    value: {"PT":{"snoForMunicipalCorporation":"string","ulbName":"string","date":"string","budgetProposedForMunicipalCorporation":"number","StateGDP":"number","statePopulation":"number","stateHousehold":"number","noOfProperties":"number"},"PGR":{"snoForMunicipalCorporation":"string","ulbName":"string","date":"string","budgetProposedForMunicipalCorporation":"number","StateGDP":"number","statePopulation":"number","stateHousehold":"number"},"TL":{"snoForMunicipalCorporation":"string","ulbName":"string","date":"string","budgetProposedForMunicipalCorporation":"number","StateGDP":"number","statePopulation":"number","stateHousehold":"number","noOfProperties":"number"},"WS":{"snoForMunicipalCorporation":"string","ulbName":"string","date":"string","budgetProposedForMunicipalCorporation":"number","StateGDP":"number","statePopulation":"number","stateHousehold":"number","noOfProperties":"number"},"MCOLLECT":{"snoForMunicipalCorporation":"string","ulbName":"string","date":"string","budgetProposedForMunicipalCorporation":"number","StateGDP":"number","statePopulation":"number","stateHousehold":"number"},"OBPS":{"snoForMunicipalCorporation":"string","ulbName":"string","date":"string","budgetProposedForMunicipalCorporation":"number","StateGDP":"number","statePopulation":"number","stateHousehold":"number","noOfProperties":"number"},"FIRENOC":{"snoForMunicipalCorporation":"string","ulbName":"string","date":"string","budgetProposedForMunicipalCorporation":"number","StateGDP":"number","statePopulation":"number","stateHousehold":"number","noOfProperties":"number"},"BIRTH":{"snoForMunicipalCorporation":"string","ulbName":"string","date":"string","budgetProposedForMunicipalCorporation":"number","StateGDP":"number","statePopulation":"number","stateHousehold":"number"},"DEATH":{"snoForMunicipalCorporation":"string","ulbName":"string","date":"string","budgetProposedForMunicipalCorporation":"number","StateGDP":"number","statePopulation":"number","stateHousehold":"number"},"FSM":{"snoForMunici