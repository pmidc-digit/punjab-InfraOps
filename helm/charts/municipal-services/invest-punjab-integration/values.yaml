# Common Labels
labels:
  app: "invest-punjab-integration"
  group: "rainmaker"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "invest-punjab-integration"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: false
    schemaTable: "invest_punjab_integration_schema"
    image:
      repository: "invest-punjab-integration-db"

# Container Configs
image:
  repository: "invest-punjab-integration"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/invest-punjab-integration/health"
  readinessProbePath: "/invest-punjab-integration/health"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx628m -Xms256m"
java-args: "-Dspring.profiles.active=monitoring"

# Additional Container Envs
env: |
  - name: SPRING_DATASOURCE_URL
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-url
  - name: DB_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-host
  - name: DB_NAME
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-name
  - name: DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: db
        key: username
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db
        key: password
  - name: DB_PORT
    value: "5432"
  - name: KAFKA_BOOTSTRAP_SERVERS
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: kafka-bootstrap-servers
  - name: KAFKA_CONSUMER_GROUP_ID
    value: "invest-punjab-integration-consumer-group"
  - name: KAFKA_CONSUMER_CONCURRENCY
    value: "3"
  - name: KAFKA_TOPIC_INVEST_PUNJAB_STATUS_UPDATE
    value: "update-invest-punjab-status"
  - name: KAFKA_TOPIC_INVEST_PUNJAB_STATUS_SUCCESS
    value: "invest-punjab-status-success"
  - name: KAFKA_TOPIC_INVEST_PUNJAB_STATUS_ERROR
    value: "invest-punjab-status-error"
  - name: KAFKA_TOPIC_TL_SAVE
    value: "save-tl-tradelicense"
  - name: KAFKA_TOPIC_TL_UPDATE
    value: "update-tl-tradelicense"
  - name: KAFKA_TOPIC_TL_WORKFLOW
    value: "update-tl-workflow"
  - name: KAFKA_TOPIC_WS_SAVE
    value: "save-ws-connection"
  - name: KAFKA_TOPIC_WS_UPDATE
    value: "update-ws-connection"
  - name: KAFKA_TOPIC_WS_WORKFLOW
    value: "update-ws-workflow"
  - name: KAFKA_TOPIC_SW_SAVE
    value: "save-sw-connection"
  - name: KAFKA_TOPIC_SW_UPDATE
    value: "update-sw-connection"
  - name: KAFKA_TOPIC_SW_WORKFLOW
    value: "update-sw-workflow"

  - name: REDIS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: redis-host
  - name: REDIS_PORT
    value: "6379"
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: redis
        key: password

  - name: INVEST_PUNJAB_BASE_URL
    value: "https://fasttrack.punjab.gov.in"
  - name: INVEST_PUNJAB_TOKEN_PATH
    value: "/integration-staging/api/iptoken/gettoken/v1"
  - name: INVEST_PUNJAB_STATUS_PATH
    value: "/integration-staging/api/localgovt/updateStatus"
  - name: INVEST_PUNJAB_CAF_PATH
    value: "/integration-staging/api/localgovt/getCAFData"
  - name: INVEST_PUNJAB_INTEGRATION_KEY
    value: "UAT_LG"
  - name: INVEST_PUNJAB_RETURN_URL
    value: "https://fasttrack.punjab.gov.in/testportal/dashboard/investor-dashboard?t=RC&role=INVT"
  - name: INVEST_PUNJAB_TOKEN_CACHE_KEY
    value: "INVEST_PUNJAB_AUTH_TOKEN"
  - name: INVEST_PUNJAB_TOKEN_MIN_BUFFER_SECONDS
    value: "30"
  - name: INVEST_PUNJAB_TOKEN_DEFAULT_TTL
    value: "3600"
  - name: INVEST_PUNJAB_DEFAULT_SOURCE
    value: "LG"

  - name: INVEST_PUNJAB_AES_KEY
    valueFrom:
      secretKeyRef:
        name: invest-punjab-integration
        key: aes-key
  - name: INVEST_PUNJAB_CHECKSUM_KEY
    valueFrom:
      secretKeyRef:
        name: invest-punjab-integration
        key: checksum-key
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SECURITY_BASIC_ENABLED
    value: "false"  
  - name: MANAGEMENT_SECURITY_ENABLED
    value: "false"
  {{- if index .Values "tracing-enabled" }}
  - name: TRACER_OPENTRACING_ENABLED
    value: "true" 
  {{- end }}
