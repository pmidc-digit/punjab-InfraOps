# Common Labels
name: kafka-connect-v2
namespace: kafka-cluster-v2

labels:
  app: kafka-connect-v2
  group: infra

# ✅ Image (your custom image with ES plugin)
image:
  repository: pmidc/kafka-connect-es
  tag: 7.5.0
  pullPolicy: Always

replicas: 3
httpPort: 8083

heap: "-Xms1G -Xmx1G"

config-storage-replication-factor: "3"
offset-storage-replication-factor: "3"
status-storage-replication-factor: "3"

# ✅ Resources
resources: |
  requests:
    memory: "1Gi"
  limits:
    memory: "1Gi"

# 🚀 ✅ FORCE ENV VIA COMMAND (FINAL FIX)
command: |
  - bash
  - -c
  - |
    export CONNECT_BOOTSTRAP_SERVERS=kafka.kafka-cluster.svc.cluster.local:9092
    export CONNECT_REST_ADVERTISED_HOST_NAME=localhost
    export CONNECT_GROUP_ID=kafka-connect-v2
    export CONNECT_CONFIG_STORAGE_TOPIC=kafka-connect-v2-config
    export CONNECT_OFFSET_STORAGE_TOPIC=kafka-connect-v2-offset
    export CONNECT_STATUS_STORAGE_TOPIC=kafka-connect-v2-status
    export CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR=3
    export CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR=3
    export CONNECT_STATUS_STORAGE_REPLICATION_FACTOR=3
    export CONNECT_KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
    export CONNECT_VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
    export CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE=false
    export CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE=false
    export CONNECT_INTERNAL_KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
    export CONNECT_INTERNAL_VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
    export CONNECT_PLUGIN_PATH=/usr/share/java,/usr/share/confluent-hub-components
    export KAFKA_HEAP_OPTS="-Xms1G -Xmx1G"

    echo "Starting Kafka Connect..."
    /etc/confluent/docker/run
